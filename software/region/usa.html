<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanificio Cucinello : USA : Login</title>
<script src="../js/modernizr-2.6.2.min.js"></script>
<link rel="stylesheet" type="text/css" href="../bootstarp/bootstrap.css" />
<link rel="stylesheet" type="text/css" href="../css/style.css" />
</head>

<body>
<!-- top nav -->
    <ul class="topNav">
    	<li><a class="admin" href="../home.html">Home</a></li>
        <li><a class="admin" href="../region.html">User Login</a></li>
        <li><a class="admin" href="../admin/login.php">Admin Login</a></li>
        <div class="clear"></div>
    </ul>
<!-- page content -->
<div id="mainPanel">
	<!-- logo -->
	<div id="logo">
		<h1><img src="../images/lc_logo_small.png" width="50" height="51" alt="Lanificio Cucinello" /> Lanificio Cucinello</h1>
    </div>
    
    <!-- content_area -->
    <div id="content_area">
    	<h3>Log In</h3>
        <!-- error -->
        <div class="alert alert-danger" id="errorMsg" role="alert" style="display:none">
        	<span class="glyphicon glyphicon-exclamation-sign" aria-hidden="true"> </span>
            <span class="sr-only">Error:</span> <strong>Invalid Credentials!</strong> Please provide correct user id and  password.
         </div>
         
         <!-- invalid -->
        <div class="alert alert-danger" id="invalidMsg" role="alert" style="display:none">
        	<span class="glyphicon glyphicon-exclamation-sign" aria-hidden="true"> </span>
            <span class="sr-only">Error:</span> <strong>Error!</strong> Please enter user id and password correctly.
         </div>
        
        <form action="" method="post" name="login" class="form-horizontal">
              <div class="form-group">
                <label for="username" class="col-sm-2 control-label">User ID</label>
                <div class="col-sm-10">
                 <input type="text" name="username" id="userid" placeholder="User ID" class="form-control" required />
                </div>
              </div>
              <div class="form-group">
                <label for="password" class="col-sm-2 control-label">Password</label>
                <div class="col-sm-10">
                <input type="password" name="password" id="password" placeholder="Password" class="form-control" required />
                </div>
              </div>
              
              <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                  <button type="button" id="login" class="btn btn-primary">Sign in</button>
                </div>
              </div>
            </form>		
	</div>
    
    <!-- footer -->
    <div id="footer">
    IA SAN MARCO 6, OCCHIEPPO SUPERIORE (Bi) ITALY<br /><div class="copyFtr">copyright &copy; 2000 Lanificio Cucinello.</div>
     </div>
</div>
<script src="../js/jquery-1.9.1.min.js"></script>
<script src="../bootstarp/bootstrap.min.js"></script> 
<script type="text/javascript">
$(document).ready(function() {	
	$('#login').click(function(){
		var userid = $('#userid'),
		password = $('#password');
		if((userid.val().length != 0) && (password.val().length != 0)) {
	 		$('#errorMsg').show();
			$('#invalidMsg').hide();
		} else {
			$('#invalidMsg').show();
			$('#errorMsg').hide();
		}
	});
});
</script>
</body>
</html>
